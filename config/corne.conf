# 1. RGB Underglow / Per-Key WS2812B
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
CONFIG_ZMK_EXT_POWER=y

# 2. Basic I2C & Display Configuration (128x32 OLED)
CONFIG_I2C=y
CONFIG_GPIO=y
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_WIDGET_LAYER_STATUS=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS=y
CONFIG_ZMK_WIDGET_OUTPUT_STATUS=y

# 3. Bluetooth Settings
CONFIG_BT=y
CONFIG_ZMK_BLE=y
CONFIG_BT_MAX_CONN=5
CONFIG_BT_MAX_PAIRED=5
CONFIG_BT_BAS=y

# 4. Standalone Macropad (Disable Split Mode)
CONFIG_ZMK_SPLIT=n

# 5. ZMK Studio Real-Time Key Mapping
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# 6. Power Management (4300mAh Battery)
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
# Prevent host OS & BLE endpoint collision
CONFIG_ZMK_BLE_PASSKEY_ENTRY=n
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Maintain clean persistent pairing bonds across USB connection switches
CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y
# Force fresh Bluetooth identity and disable BLE battery reporting clash
CONFIG_ZMK_KEYBOARD_NAME="Corne Pad"
CONFIG_BT_DEVICE_NAME="Corne Pad"

# Prevent USB-disconnect BLE handshake loop
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n
CONFIG_ZMK_BLE_CLEAR_BONDS_ON_START=n
