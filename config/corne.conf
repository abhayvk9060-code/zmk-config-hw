# 1. RGB Underglow / WS2812B
# Enable RGB Underglow and WS2812 drivers
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y

# Enable the dedicated SPIM3 hardware block for nRF52840
CONFIG_NRFX_SPIM3=y

# Force RGB to turn ON immediately upon booting
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y

# Allow RGB to stay ON while running on battery/unplugged
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=n
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=n

# Disconnect the internal MOSFET gate rule so it doesn't wait for ext-power
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n

# Default brightness (50%)
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=50
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=0

# 2. I2C & OLED Display
CONFIG_I2C=y
CONFIG_GPIO=y
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_WIDGET_LAYER_STATUS=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS=y
CONFIG_ZMK_WIDGET_OUTPUT_STATUS=y

# 3. Standalone Macropad (Disable Split Mode)
CONFIG_ZMK_SPLIT=n

# 4. Bluetooth Core & Bonding Settings
CONFIG_BT=y
CONFIG_ZMK_BLE=y
CONFIG_ZMK_USB=y
CONFIG_BT_MAX_CONN=5
CONFIG_BT_MAX_PAIRED=5
CONFIG_BT_BAS=y
CONFIG_ZMK_BLE_PASSKEY_ENTRY=n

# Boost BLE antenna transmit power to maximum
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Disable ZMK Studio RPC over BLE (keep Studio strictly on wired USB)
CONFIG_ZMK_STUDIO_TRANSPORT_BLE=n

# Device Identity
CONFIG_ZMK_KEYBOARD_NAME="Corne Pad"
CONFIG_BT_DEVICE_NAME="Corne Pad"

# 5. ZMK Studio Real-Time Key Mapping
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# 6. Power Management & Sleep
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Force persistent flash storage for BLE bonds
CONFIG_BT_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y

# Enable modern Zephyr BLE security & persistent reconnection
CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
