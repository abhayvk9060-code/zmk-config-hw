# OLED test
CONFIG_I2C=y
CONFIG_GPIO=y

CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=y
CONFIG_SSD1306=y

# Standalone keyboard
CONFIG_ZMK_SPLIT=n

# Bluetooth / USB
CONFIG_BT=y
CONFIG_ZMK_BLE=y
CONFIG_ZMK_USB=y

CONFIG_BT_MAX_CONN=5
CONFIG_BT_MAX_PAIRED=5
CONFIG_BT_BAS=y

# Keyboard name
CONFIG_ZMK_KEYBOARD_NAME="Corne Pad"
CONFIG_BT_DEVICE_NAME="Corne Pad"
